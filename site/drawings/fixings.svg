<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="Side of the two steps: three rises off the path, ribbon screwed to the piles, small piles under the front beam"><title>Side of the two steps: three rises off the path, ribbon screwed to the piles, small piles under the front beam</title><style>text{font-family:system-ui,sans-serif;fill:#21382f}line{stroke-width:1.5}</style><rect width="1100" height="720" fill="#fbfbf8"/><text x="40.0" y="32.0" font-size="21" text-anchor="start">3 · The two steps, side on</text><text x="40.0" y="58.0" font-size="13" text-anchor="start">Tape the rises off the path. 32 mm boards. Bottom framing is ripped where it would hit the path.</text><rect x="135.0" y="430.0" width="495.0" height="70.0" fill="#ece5d6" stroke="#52675b"/><rect x="190.0" y="405.2" width="385.0" height="74.4" fill="#cfc6b4" stroke="#52675b"/><line x1="107.5" y1="430.0" x2="630.0" y2="430.0" stroke="#52675b" /><rect x="160.9" y="314.1" width="68.8" height="239.9" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="495.3" y="417.6" width="44.0" height="111.6" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="170.8" y="226.6" width="49.5" height="86.8" fill="#cba773" stroke="#52675b"/><rect x="107.5" y="139.8" width="137.5" height="86.8" fill="#456b54" stroke="#52675b"/><rect x="220.2" y="139.8" width="24.8" height="86.8" fill="#cba773" stroke="#52675b"/><rect x="107.5" y="120.0" width="137.5" height="19.8" fill="#cba773" stroke="#52675b"/><rect x="220.2" y="346.3" width="49.5" height="74.4" fill="#cba773" stroke="#52675b"/><rect x="269.8" y="346.3" width="233.8" height="27.9" fill="#456b54" stroke="#52675b"/><rect x="503.5" y="346.3" width="49.5" height="74.4" fill="#cba773" stroke="#52675b"/><rect x="245.0" y="243.4" width="49.5" height="86.8" fill="#af6b3c" stroke="#52675b"/><rect x="294.5" y="243.4" width="104.5" height="27.9" fill="#456b54" stroke="#52675b"/><rect x="399.0" y="243.4" width="49.5" height="86.8" fill="#af6b3c" stroke="#52675b"/><rect x="245.0" y="223.5" width="154.0" height="19.8" fill="#cba773" stroke="#52675b"/><rect x="399.0" y="326.5" width="154.0" height="19.8" fill="#cba773" stroke="#52675b"/><text x="113.0" y="101.4" font-size="12" text-anchor="start">Deck +500</text><text x="289.0" y="203.7" font-size="12" text-anchor="start">Top +333</text><text x="432.0" y="306.0" font-size="12" text-anchor="start">Bottom +167</text><text x="256.0" y="442.4" font-size="12" text-anchor="start">path</text><text x="680.0" y="120.0" font-size="15" text-anchor="start">F5 · ribbon into the piles</text><text x="680.0" y="146.0" font-size="13" text-anchor="start">Four 14g×100 from the side</text><text x="680.0" y="184.0" font-size="15" text-anchor="start">F7 · top ribbon into the bearer</text><text x="680.0" y="210.0" font-size="13" text-anchor="start">Same screws. Pack the front.</text><text x="680.0" y="248.0" font-size="15" text-anchor="start">Front beam</text><text x="680.0" y="274.0" font-size="13" text-anchor="start">Full 140 is 71% of the screen</text><text x="680.0" y="300.0" font-size="13" text-anchor="start">Ripped half-bay is 47%</text><text x="680.0" y="338.0" font-size="15" text-anchor="start">No handrail</text><text x="680.0" y="364.0" font-size="13" text-anchor="start">Three rises. One more needs a rail.</text><text x="40.0" y="620.0" font-size="13" text-anchor="start">F1 nails on the doubles. F2 four skew nails at every pile, including the small ones.</text><text x="40.0" y="648.0" font-size="13" text-anchor="start">F6 two M12 bolts where the rebuilt strip meets the deck. F8 a board on the face and on each riser.</text><text x="40.0" y="676.0" font-size="13" text-anchor="start">Bottom step is H4. It does not clear the path by 150 mm. The deck piles do.</text></svg>
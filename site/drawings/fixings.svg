<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 815" role="img" aria-label="Draft hanging tread fixing section and fixing schedule:seven414mmH4cleats,twoM12bolts perupper/lowerrow,mainrim directlyoverbearer;full connectioncapacityunfinished"><title>Draft hanging tread fixing section and fixing schedule:seven414mmH4cleats,twoM12bolts perupper/lowerrow,mainrim directlyoverbearer;full connectioncapacityunfinished</title><style>text{font-family:system-ui,sans-serif;fill:#21382f}line{stroke-width:1.5}</style><text x="40" y="35" font-size="21">3 · Fixing schedule and hanging-tread section</text><text x="40" y="65" font-size="14">DRAFT CONNECTION · complete load-path check required before drilling or construction</text><rect x="55" y="328.84000000000003" width="90" height="100.8" fill="#cba773" stroke="#52675b"/><rect x="100" y="228.04000000000002" width="45" height="100.8" fill="#cba773" stroke="#52675b"/><rect x="145" y="228.04000000000002" width="45" height="298.08" fill="#d8b786" stroke="#52675b"/><rect x="65" y="205.0" width="125" height="23.04" fill="#cba773" stroke="#52675b"/><rect x="190" y="385.0" width="400" height="23.04" fill="#cba773" stroke="#52675b"/><rect x="190" y="408.03999999999996" width="45" height="100.8" fill="#cba773" stroke="#52675b"/><rect x="545" y="408.03999999999996" width="45" height="100.8" fill="#cba773" stroke="#52675b"/><rect x="235" y="408.03999999999996" width="310" height="100.8" fill="#456b54" stroke="#52675b"/><rect x="500" y="509.38" width="90" height="125" fill="#d6dad7" stroke="#52675b"/><line x1="55" y1="565.0" x2="675" y2="565.0" stroke="#71847b" /><line x1="90" y1="291.40000000000003" x2="200" y2="291.40000000000003" stroke="#324c42" /><line x1="135" y1="455.56" x2="245" y2="455.56" stroke="#324c42" /><text x="50" y="165" font-size="13">Deck +500</text><text x="240" y="370" font-size="13">Tread +250</text><text x="245" y="520" font-size="12">Rail bottom +78 /concrete+77.25</text><text x="50" y="600" font-size="12">Inner rim directly bears on front bearer; cleat head forms part of outer rim layer.</text><text x="710" y="155" font-size="16">F5 · Seven H4 cleats</text><text x="710" y="186" font-size="14">140×45, cut 414</text><text x="710" y="217" font-size="13">Upper bolts Z380</text><text x="710" y="246" font-size="13">Lower bolts Z152</text><text x="710" y="275" font-size="13">TwoM12 per row, 80 centres</text><text x="710" y="304" font-size="12">M12×120 +50 square washers</text><text x="710" y="353" font-size="13">Rim reaction up to 5.30 kN</text><text x="710" y="382" font-size="13">Eccentric moment 0.477 kNm</text><text x="710" y="411" font-size="13">Assembly capacity not verified</text><text x="40" y="655" font-size="12">F1: 90×4 SS ply nails, two rows≤250 centres. F2: ordinary piles 4×100×3.75 SS skew nails.</text><text x="40" y="685" font-size="12">F3: standard joist/rim/block nails. F4: three genuine SSCPC40 hold-down pairs at rebuilt rear row.</text><text x="40" y="715" font-size="12">F6: twoM12 rim ties at rebuilt/main junction. F7: complete 4 anchors and 6 outer pad restraint points.</text><text x="40" y="748" font-size="12">Front-rim reinforcement, bolt groups, stair-loaded crosspiece ends and pad restraint remain to check.</text><text x="40" y="780" font-size="12">Builder brief also checks cladding clearance, door threshold and weatherproofing.</text></svg>
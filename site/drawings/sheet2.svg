2.92" font-size="7.4" font-weight="650" text-anchor="start" fill="#111111">SIZE</text><text x="1115.00" y="792.92" font-size="7.4" font-weight="500" text-anchor="start" fill="#111111">A2</text><line x1="860.00" y1="799.00" x2="1172.00" y2="799.00" stroke="#111111" stroke-width="0.55" fill="none"/><line x1="936.00" y1="799.00" x2="936.00" y2="818.00" stroke="#111111" stroke-width="0.45" fill="none"/><line x1="1024.00" y1="799.00" x2="1024.00" y2="818.00" stroke="#111111" stroke-width="0.45" fill="none"/><line x1="1110.00" y1="799.00" x2="1110.00" y2="818.00" stroke="#111111" stroke-width="0.45" fill="none"/><text x="865.00" y="811.92" font-size="7.4" font-weight="650" text-anchor="start" fill="#111111">SHEET</text><text x="941.00" y="811.92" font-size="7.4" font-weight="500" text-anchor="start" fill="#111111">2 OF 2</text><text x="1029.00" y="811.92" font-size="7.4" font-weight="650" text-anchor="start" fill="#111111">DWG NO.</text><text x="1115.00" y="811.92" font-size="7.4" font-weight="500" text-anchor="start" fill="#111111">0001</text><text x="848.00" y="810.00" font-size="6.5" font-weight="500" text-anchor="end" fill="#111111">NOT ISL38807</text><text x="36.00" y="42.00" font-size="8" font-weight="700" text-anchor="start" fill="#008f2d">NOTES</text><text x="36.00" y="54.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">1. OWNER-BUILDER WORKING PLAN.</text><text x="36.00" y="66.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">THIS IS NOT DRAWING ISL38807.</text><text x="36.00" y="78.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">IT IS NOT FOR CONSENT.</text><text x="36.00" y="90.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">2. TIMBER IS 140×45 SG8.</text><text x="36.00" y="102.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">H3.2 ON THE DECK AND THE</text><text x="36.00" y="114.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">REBUILT STRIP. H4 ON THE STEPS.</text><text x="36.00" y="126.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">PILES ARE 125×125 H5.</text><text x="36.00" y="138.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">3. 16 PILES. HOLES 400×400,</text><text x="36.00" y="150.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">600 DEEP. NO ANCHOR PILES</text><text x="36.00" y="162.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">AND NO BRACKETS.</text><text x="36.00" y="174.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">4. SIX STEP PILES. HOLES</text><text x="36.00" y="186.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">300×300 AND 400 DEEP.</text><text x="36.00" y="198.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">5. THE PATH STAYS. NO HOLE</text><text x="36.00" y="210.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">IN IT. WEST DRAINS: SPADE,</text><text x="36.00" y="222.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">AND 500 CLEAR OF A PIPE.</text><text x="36.00" y="234.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">6. RISES ARE TAPED OFF THE</text><text x="36.00" y="246.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">PATH. IF THE TAPE IS NOT 500,</text><text x="36.00" y="258.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">DIVIDE IT BY THREE.</text><text x="36.00" y="270.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">7. NO HANDRAIL. THREE RISES</text><text x="36.00" y="282.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">IS THE LIMIT.</text><text x="36.00" y="294.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">8. RIP THE BOTTOM STEP TO</text><text x="36.00" y="306.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">120 MIN OVER THE PATH.</text><text x="36.00" y="318.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">LEAVE 15 OF AIR.</text><text x="36.00" y="330.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">9. SCREWS INTO A BEARER GO</text><text x="36.00" y="342.00" font-size="8" font-weight="500" text-anchor="start" fill="#008f2d">IN FROM THE SIDE.</text><line x1="56.00" y1="640.00" x2="308.80" y2="640.00" stroke="#111111" stroke-width="0.8" fill="none"/><rect x="75.00" y="625.04" width="10.00" height="14.96" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="251.80" y="625.04" width="10.00" height="14.96" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="300.20" y="636.80" width="10.00" height="6.40" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="56.00" y="602.56" width="208.00" height="11.20" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="56.00" y="600.00" width="208.00" height="2.56" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="264.00" y="613.36" width="22.40" height="2.56" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="286.40" y="626.64" width="22.40" height="2.56" fill="none" stroke="#111111" stroke-width="0.8"/><text x="168.00" y="668.00" font-size="10" font-weight="700" text-anchor="middle" fill="#008f2d">END ELEVATION</text><line x1="126.00" y1="671.00" x2="210.00" y2="671.00" stroke="#008f2d" stroke-width="0.8" fill="none"/><text x="168.00" y="684.00" font-size="7.5" font-weight="600" text-anchor="middle" fill="#008f2d">SCALE 1:25</text><rect x="760.00" y="90.00" width="80.00" height="120.00" fill="none" stroke="#111111" stroke-width="0.8"/><rect x="787.50" y="42.00" width="25.00" height="150.00" fill="none" stroke="#111111" stroke-width="0.8"/><line x1="744.00" y1="210.00" x2="856.00" y2="210.00" stroke="#111111" stroke-width="0.7" fill="none"/><line x1="734.00" y1="214.00" x2="750.00" y2="232.00" stroke="#777" stroke-width="0.4" fill="none"/><line x1="742.00" y1="214.0
 x="192.7" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="238.5" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="284.4" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="330.3" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="376.2" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="422.1" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="465.6" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="470.3" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="513.8" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="559.7" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="605.6" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="651.5" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="697.4" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><rect x="743.3" y="537.1" width="4.7" height="34.2" fill="#456b54" stroke="#52675b"/><text x="790.0" y="250.0" font-size="13" text-anchor="start">Deck: 17 joists of 2510</text><text x="790.0" y="276.0" font-size="13" text-anchor="start">Flush, then 437 centres</text><text x="790.0" y="302.0" font-size="13" text-anchor="start">Doubled joist at 3956</text><text x="790.0" y="328.0" font-size="13" text-anchor="start">Span 2.21 m</text><text x="790.0" y="366.0" font-size="13" text-anchor="start">Steps stick out 560</text><text x="790.0" y="392.0" font-size="13" text-anchor="start">Going 280, rise about 167</text><text x="790.0" y="418.0" font-size="13" text-anchor="start">Bottom beam may be ripped</text><text x="790.0" y="444.0" font-size="13" text-anchor="start">to 120 where it hits the path</text><text x="40.0" y="700.0" font-size="13" text-anchor="start">Bearers nailed as two plies. Joists sit on them. Screws into a bearer go in from the side.</text><text x="40.0" y="732.0" font-size="13" text-anchor="start">Do not cut a stringer. Ribbon to the piles, joists out, front beam on the small piles, then the top step.</text><text x="40.0" y="764.0" font-size="13" text-anchor="start">Board butts land on the doubled joist at 3956. Face board on the boundary joist.</text></svg>
"start">Deck: 17 joists of 2510</text><text x="790.0" y="276.0" font-size="13" text-anchor="start">Flush, then 437 centres</text><text x="790.0" y="302.0" font-size="13" text-anchor="start">Doubled joist centred at 3956</text><text x="790.0" y="328.0" font-size="13" text-anchor="start">2.21 m span, bearers Y300/Y2510</text><text x="790.0" y="354.0" font-size="13" text-anchor="start">Plain rims Y0 and Y2555</text><text x="790.0" y="380.0" font-size="13" text-anchor="start"></text><text x="790.0" y="406.0" font-size="13" text-anchor="start">Rebuilt: 3 joists of 1880</text><text x="790.0" y="432.0" font-size="13" text-anchor="start">2 blocks, cut at 380</text><text x="790.0" y="458.0" font-size="13" text-anchor="start"></text><text x="790.0" y="484.0" font-size="13" text-anchor="start">Step: 5 frames of 900</text><text x="790.0" y="510.0" font-size="13" text-anchor="start">3 crosspieces each, 4 pavers</text><text x="790.0" y="536.0" font-size="13" text-anchor="start">Orange tie on the bearer face</text><text x="40.0" y="635.0" font-size="13" text-anchor="start">Bearers: 2×140×45 nailed (F1). Joists sit on the bearers and are nailed through the rims. No blocking in the deck.</text><text x="40.0" y="666.0" font-size="13" text-anchor="start">Step frames are separate. Do not cut a 6.6 m rail. Assemble each 900 mm frame on its pavers.</text><text x="40.0" y="697.0" font-size="13" text-anchor="start">Boards cross a 395 mm gap between frames. Deck butts land on the doubled joist at 3956.</text><text x="40.0" y="730.0" font-size="13" text-anchor="start">Cuts: deck 17×2510, rebuilt 3×1880 and 2×380; step 20×900, crosspieces 15×220, ties 5×250.</text><text x="40.0" y="763.0" font-size="12" text-anchor="start">Rear line Y−1970 is the rebuilt bearer back face; its centre is −1925. The old bearer is not reused.</text></svg>
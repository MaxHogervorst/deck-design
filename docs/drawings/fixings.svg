<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" role="img" aria-label="Section through the deck front edge at a step pad: deck on bearer and pile, step double rails on two pavers over a GAP7 pit, cleat on the bearer face; fixing schedule F1 to F8"><title>Section through the deck front edge at a step pad: deck on bearer and pile, step double rails on two pavers over a GAP7 pit, cleat on the bearer face; fixing schedule F1 to F8</title><style>text{font-family:system-ui,sans-serif;fill:#21382f}line{stroke-width:1.5}</style><rect width="1100" height="1000" fill="#fbfbf8"/><text x="40.0" y="35.0" font-size="21" text-anchor="start">3 · Fixings and step section at a pad</text><text x="40.0" y="65.0" font-size="13" text-anchor="start">The step bears on two pavers per pad; the cleat only ties it sideways to the deck. Nothing is poured level.</text><rect x="60.0" y="560.0" width="600.0" height="250.0" fill="#ece5d6" stroke="#52675b"/><line x1="60.0" y1="560.0" x2="660.0" y2="560.0" stroke="#52675b" /><rect x="150.0" y="550.0" width="480.0" height="85.0" fill="#d6dad7" stroke="#9aa89f"/><rect x="207.0" y="530.0" width="180.0" height="20.0" fill="#b9b3a6" stroke="#52675b"/><rect x="270.0" y="521.0" width="54.0" height="9.0" fill="#fff" stroke="#9aa89f"/><rect x="393.0" y="530.0" width="180.0" height="20.0" fill="#b9b3a6" stroke="#52675b"/><rect x="456.0" y="521.0" width="54.0" height="9.0" fill="#fff" stroke="#9aa89f"/><rect x="111.0" y="610.0" width="210.0" height="175.0" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="178.5" y="466.5" width="75.0" height="268.5" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="189.0" y="396.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="60.0" y="326.0" width="183.0" height="70.0" fill="#456b54" stroke="#52675b"/><rect x="243.0" y="326.0" width="27.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="60.0" y="310.0" width="210.0" height="16.0" fill="#cba773" stroke="#52675b"/><rect x="243.0" y="396.0" width="27.0" height="125.0" fill="#af6b3c" stroke="#52675b"/><rect x="270.0" y="451.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="324.0" y="451.0" width="132.0" height="70.0" fill="#456b54" stroke="#52675b"/><rect x="456.0" y="451.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="270.0" y="435.0" width="240.0" height="16.0" fill="#cba773" stroke="#52675b"/><line x1="243.0" y1="431.0" x2="225.0" y2="431.0" stroke="#324c42" /><line x1="243.0" y1="501.0" x2="225.0" y2="501.0" stroke="#324c42" /><line x1="270.0" y1="486.0" x2="288.0" y2="486.0" stroke="#324c42" /><line x1="270.0" y1="471.0" x2="288.0" y2="471.0" stroke="#324c42" /><text x="90.0" y="295.0" font-size="12" text-anchor="start">Deck +500</text><text x="330.0" y="420.0" font-size="12" text-anchor="start">Step +250</text><text x="516.0" y="517.5" font-size="10" text-anchor="start">DPC + packers</text><text x="516.0" y="537.5" font-size="10" text-anchor="start">paver 300×300, top +45…+75</text><text x="516.0" y="590.0" font-size="10" text-anchor="start">GAP7 pit 450×800, tamped</text><text x="90.0" y="570.0" font-size="11" text-anchor="start">0 · lawn</text><text x="90.0" y="710.0" font-size="10" text-anchor="start">pile footing (dashed, other X)</text><text x="246.0" y="700.0" font-size="11" text-anchor="start">firm ground</text><text x="147.0" y="430.0" font-size="11" text-anchor="start">bearer</text><text x="186.0" y="280.0" font-size="11" text-anchor="start">joist / rim</text><text x="222.0" y="525.0" font-size="11" text-anchor="start">cleat</text><text x="680.0" y="150.0" font-size="16" text-anchor="start">F8 · Rails on pavers</text><text x="680.0" y="178.0" font-size="13" text-anchor="start">No fixing into the pavers</text><text x="680.0" y="204.0" font-size="13" text-anchor="start">Pack under each rail until the frame top</text><text x="680.0" y="228.0" font-size="13" text-anchor="start">is 250 below the rim top and nothing rocks</text><text x="680.0" y="268.0" font-size="16" text-anchor="start">F5 · Cleats</text><text x="680.0" y="296.0" font-size="13" text-anchor="start">3×250 mm H4 on bearer face</text><text x="680.0" y="320.0" font-size="13" text-anchor="start">2×14g×100 into bearer, 2 into rail</text><text x="680.0" y="344.0" font-size="13" text-anchor="start">Sideways tie only; no step weight</text><text x="680.0" y="384.0" font-size="16" text-anchor="start">Rail screen</text><text x="680.0" y="412.0" font-size="13" text-anchor="start">1.96 of 2.20 kNm (89%)</text><text x="680.0" y="436.0" font-size="13" text-anchor="start">max pad load 6.6 kN, 37 kPa</text><text x="40.0" y="860.0" font-size="12" text-anchor="start">F1: 90×4 SS nails, two rows at 250, alternating faces, for bearers and step rails. F2: 4×100×4 SS skew nails per pile.</text><text x="40.0" y="888.0" font-size="12" text-anchor="start">F3: two 100×4 per joist end through the rim, two per crosspiece end through the inner rail ply. F4: three SSCPC40 pairs at the rear.</text><text x="40.0" y="916.0" font-size="12" text-anchor="start">F6: two M12×120 SS coach bolts at X200/700, Z398. F7: four corner anchor kits (12 kN SS). F8: step rails free on pavers.</text><text x="40.0" y="944.0" font-size="12" text-anchor="start">Before building: measure the door sill and cladding gap, call beforeUdig, and read the assumptions at the end of the guide.</text><text x="40.0" y="972.0" font-size="12" text-anchor="start">Drawn at a pad; the pile and its footing (dashed) are at a different X and never share ground with a paver pit.</text></svg>
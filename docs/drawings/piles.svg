text><text x="180.0" y="169.0" font-size="12" text-anchor="start">Rear bearer back face Y−1970, centre −1925</text><text x="180.0" y="205.0" font-size="12" text-anchor="start">Middle bearer centre Y−800</text><text x="401.5" y="421.0" font-size="13" text-anchor="middle">Main deck: 12 piles on rows Y300 and Y2510 (orange = corner anchors)</text><text x="401.5" y="605.5" font-size="12" text-anchor="middle">Five step pits in the bays, four pavers each, clear of the pile holes</text><text x="790.0" y="105.0" font-size="14" text-anchor="start">Heights · lawn = 0</text><rect x="790.0" y="340.0" width="280.0" height="100.0" fill="#ece5d6" stroke="#52675b"/><line x1="790.0" y1="340.0" x2="1070.0" y2="340.0" stroke="#71847b" /><rect x="800.0" y="150.0" width="130.0" height="12.0" fill="#cba773" stroke="#52675b"/><rect x="810.0" y="162.2" width="110.0" height="53.2" fill="#456b54" stroke="#52675b"/><rect x="820.0" y="215.4" width="90.0" height="53.2" fill="#cba773" stroke="#52675b"/><rect x="850.0" y="268.9" width="30.0" height="71.0" fill="#cba773" stroke="#52675b"/><rect x="950.0" y="245.0" width="100.0" height="12.0" fill="#cba773" stroke="#52675b"/><rect x="955.0" y="257.2" width="85.0" height="53.2" fill="#cba773" stroke="#52675b"/><rect x="960.0" y="310.4" width="75.0" height="6.0" fill="#fff" stroke="#52675b"/><rect x="960.0" y="317.2" width="75.0" height="15.0" fill="#b9b3a6" stroke="#52675b"/><rect x="955.0" y="332.4" width="85.0" height="57.0" fill="#d6dad7" stroke="#9aa89f" stroke-dasharray="3 3"/><text x="800.0" y="134.0" font-size="13" text-anchor="start">Deck +500</text><text x="950.0" y="225.0" font-size="13" text-anchor="start">Step +250</text><text x="800.0" y="370.0" font-size="12" text-anchor="start">0 · lawn / path</text><text x="1000.0" y="303.9" font-size="10" text-anchor="start">H4 packer + DPC</text><text x="1000.0" y="324.8" font-size="10" text-anchor="start">paver top +45…+75</text><text x="1000.0" y="362.8" font-size="10" text-anchor="start">GAP7, tamped</text><text x="790.0" y="490.0" font-size="14" text-anchor="start">16 timber piles, one pour</text><text x="790.0" y="516.0" font-size="12" text-anchor="start">12 ordinary · 450 deep, square or 400 auger</text><text x="790.0" y="538.0" font-size="12" text-anchor="start">4 corner anchors · 900 deep</text><text x="790.0" y="572.0" font-size="14" text-anchor="start">5 step pits, no concrete</text><text x="790.0" y="598.0" font-size="12" text-anchor="start">pit 760×800, GAP7, off the pile holes</text><text x="790.0" y="620.0" font-size="12" text-anchor="start">4 pavers 300×300 per frame</text><text x="40.0" y="635.0" font-size="13" text-anchor="start">Main pile X: 62.5 / 1357.5 / 2652.5 / 3947.5 / 5242.5 / 6537.5 · rows Y300 / Y2510. Pile tops cut to a string.</text><text x="40.0" y="666.0" font-size="12" text-anchor="start">Step frames centred 710 / 2005 / 3300 / 4595 / 5890 · pavers 220 mm each side of those · pits after the deck frame is up.</text><text x="40.0" y="697.0" font-size="12" text-anchor="start">Nothing is poured level. Piles are cut to a string. Pavers are tapped to a tape off the deck rim. An H4 offcut takes up a low paver.</text><text x="40.0" y="730.0" font-size="12" text-anchor="start">One pour: about 0.99 m³. Mini-mix 1.2 m³, or 115 bags of 20 kg if the truck cannot get in.</text><text x="40.0" y="763.0" font-size="12" text-anchor="start">Concrete path stays. No hole in it. Waste and rainwater are west of the deck: hand dig, 500 mm clear.</text><text x="40.0" y="796.0" font-size="12" text-anchor="start">Pile symbols show position only. Shift a pile off the path or a pipe rather than stretching a bearer past 1.4 m.</text></svg>
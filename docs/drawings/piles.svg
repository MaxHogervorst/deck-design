eight="27.0" fill="none" stroke="#9aa89f" stroke-dasharray="3 3"/><rect x="329.3" y="571.8" width="8.4" height="7.2" fill="#af6b3c" stroke="#52675b"/><rect x="453.7" y="561.8" width="31.5" height="27.0" fill="none" stroke="#9aa89f" stroke-dasharray="3 3"/><rect x="465.3" y="571.8" width="8.4" height="7.2" fill="#af6b3c" stroke="#52675b"/><rect x="589.7" y="561.8" width="31.5" height="27.0" fill="none" stroke="#9aa89f" stroke-dasharray="3 3"/><rect x="601.3" y="571.8" width="8.4" height="7.2" fill="#af6b3c" stroke="#52675b"/><rect x="725.7" y="561.8" width="31.5" height="27.0" fill="none" stroke="#9aa89f" stroke-dasharray="3 3"/><rect x="737.2" y="571.8" width="8.4" height="7.2" fill="#af6b3c" stroke="#52675b"/><text x="185.0" y="133.0" font-size="12" text-anchor="start">Rebuilt strip: four piles, same 600 mm holes</text><text x="401.5" y="421.0" font-size="13" text-anchor="middle">16 piles. Two rows. Every hole 400×400×600</text><text x="401.5" y="605.5" font-size="12" text-anchor="middle">Six step piles on the same X, 300×300×400. Two spare if the path is in a bay</text><text x="790.0" y="100.0" font-size="14" text-anchor="start">Heights off the path</text><text x="790.0" y="128.0" font-size="13" text-anchor="start">Deck boards +500</text><text x="790.0" y="152.0" font-size="13" text-anchor="start">Bottom step about +167</text><text x="790.0" y="176.0" font-size="13" text-anchor="start">Top step about +333</text><text x="790.0" y="200.0" font-size="13" text-anchor="start">Three equal rises. No rail</text><text x="790.0" y="236.0" font-size="14" text-anchor="start">16 piles, one length</text><text x="790.0" y="260.0" font-size="12" text-anchor="start">Buy 1.2 m and cut to the string</text><text x="790.0" y="284.0" font-size="12" text-anchor="start">750 mm does not reach</text><text x="790.0" y="320.0" font-size="14" text-anchor="start">Concrete, pile left in</text><text x="790.0" y="344.0" font-size="12" text-anchor="start">Twelve holes 1.15 m³</text><text x="790.0" y="368.0" font-size="12" text-anchor="start">All of it about 1.82 m³</text><text x="790.0" y="392.0" font-size="12" text-anchor="start">Truck 2.0 m³, or mix as you go</text><text x="40.0" y="700.0" font-size="12" text-anchor="start">Concrete path stays. No hole in it. Stormwater through the gate, waste beside it. Spade, 500 mm clear.</text><text x="40.0" y="732.0" font-size="12" text-anchor="start">Pile marks are the starting grid. Slide a pile off the path or a pipe. Do not open a bay past 1.4 m.</text><text x="40.0" y="764.0" font-size="12" text-anchor="start">Orange squares are the step piles. Green squares are the deck and rebuilt piles.</text></svg>
roke="#7f8f86" stroke-dasharray="4 3"/><rect x="690.2" y="526.8" width="31.5" height="40.5" fill="none" stroke="#7f8f86" stroke-dasharray="4 3"/><text x="215.0" y="125.0" font-size="19" text-anchor="start">All boards run along X →</text><text x="215.0" y="158.0" font-size="13" text-anchor="start">Main + rebuilt + tread</text><text x="790.0" y="250.0" font-size="13" text-anchor="start">Main: 17 joists of 2510</text><text x="790.0" y="276.0" font-size="13" text-anchor="start">16 lines at 437 + butt pair 3933/3978</text><text x="790.0" y="302.0" font-size="13" text-anchor="start">2.21 m span on bearers Y300/Y2510</text><text x="790.0" y="328.0" font-size="13" text-anchor="start">Plain rims Y0 and Y2555</text><text x="790.0" y="354.0" font-size="13" text-anchor="start"></text><text x="790.0" y="380.0" font-size="13" text-anchor="start">Rebuilt: 3 joists of 1880</text><text x="790.0" y="406.0" font-size="13" text-anchor="start">2 blocks over Y−800 bearer</text><text x="790.0" y="432.0" font-size="13" text-anchor="start"></text><text x="790.0" y="458.0" font-size="13" text-anchor="start">Tread: 2 double rails 6600</text><text x="790.0" y="484.0" font-size="13" text-anchor="start">17 crosspieces of 220</text><text x="790.0" y="510.0" font-size="13" text-anchor="start">3 tie cleats (orange) on bearer face</text><text x="790.0" y="536.0" font-size="13" text-anchor="start">6 pads (dashed)</text><text x="40.0" y="635.0" font-size="13" text-anchor="start">Bearers: 2×140×45 nailed (F1). Joists sit on the bearers and are nailed to the rims; no blocking in the main deck.</text><text x="40.0" y="666.0" font-size="13" text-anchor="start">Tread rails: 2×140×45 H4 nailed like a bearer, inner Y2600–2690, outer Y2910–3000, continuous 6600.</text><text x="40.0" y="697.0" font-size="13" text-anchor="start">Crosspieces at the joist centres so board screw lines run straight through. Butt line X3955 has pairs in deck and tread.</text><text x="40.0" y="730.0" font-size="13" text-anchor="start">Cuts: main 17×2510, rebuilt 3×1880; tread rails 4×6600, crosspieces 17×220, cleats 3×250.</text><text x="40.0" y="763.0" font-size="12" text-anchor="start">Rear line Y−1970 is the rebuilt bearer back face; its centre is −1925. The old bearer is not reused.</text></svg>
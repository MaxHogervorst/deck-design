<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" role="img" aria-label="Section through the deck front edge at a tread pad: deck on bearer and pile, tread double rails on the pad with brackets, tie cleat on the bearer face; fixing schedule F1 to F7"><title>Section through the deck front edge at a tread pad: deck on bearer and pile, tread double rails on the pad with brackets, tie cleat on the bearer face; fixing schedule F1 to F7</title><style>text{font-family:system-ui,sans-serif;fill:#21382f}line{stroke-width:1.5}</style><rect width="1100" height="1000" fill="#fbfbf8"/><text x="40.0" y="35.0" font-size="21" text-anchor="start">3 · Fixing schedule and tread section at a pad</text><text x="40.0" y="65.0" font-size="13" text-anchor="start">Tread bears on the pads; the cleats only tie it sideways. Builder confirms F7 hardware before anchors are drilled.</text><rect x="60.0" y="560.0" width="540.0" height="250.0" fill="#ece5d6" stroke="#52675b"/><line x1="60.0" y1="560.0" x2="600.0" y2="560.0" stroke="#52675b" /><rect x="240.0" y="610.0" width="300.0" height="175.0" fill="#d6dad7" stroke="#52675b"/><rect x="255.0" y="521.5" width="270.0" height="88.5" fill="#d6dad7" stroke="#52675b"/><line x1="330.0" y1="685.0" x2="330.0" y2="535.0" stroke="#6b6b6b" /><line x1="450.0" y1="685.0" x2="450.0" y2="535.0" stroke="#6b6b6b" /><rect x="111.0" y="610.0" width="210.0" height="175.0" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="178.5" y="466.5" width="75.0" height="268.5" fill="none" stroke="#9aa89f" stroke-dasharray="4 3"/><rect x="189.0" y="396.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="60.0" y="326.0" width="183.0" height="70.0" fill="#456b54" stroke="#52675b"/><rect x="243.0" y="326.0" width="27.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="60.0" y="310.0" width="210.0" height="16.0" fill="#cba773" stroke="#52675b"/><rect x="243.0" y="396.0" width="27.0" height="125.0" fill="#af6b3c" stroke="#52675b"/><rect x="270.0" y="451.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="324.0" y="451.0" width="132.0" height="70.0" fill="#456b54" stroke="#52675b"/><rect x="456.0" y="451.0" width="54.0" height="70.0" fill="#cba773" stroke="#52675b"/><rect x="270.0" y="435.0" width="240.0" height="16.0" fill="#cba773" stroke="#52675b"/><line x1="324.0" y1="510.0" x2="354.0" y2="510.0" stroke="#324c42" /><line x1="354.0" y1="510.0" x2="354.0" y2="521.5" stroke="#324c42" /><line x1="456.0" y1="510.0" x2="426.0" y2="510.0" stroke="#324c42" /><line x1="426.0" y1="510.0" x2="426.0" y2="521.5" stroke="#324c42" /><line x1="243.0" y1="431.0" x2="225.0" y2="431.0" stroke="#324c42" /><line x1="243.0" y1="501.0" x2="225.0" y2="501.0" stroke="#324c42" /><line x1="270.0" y1="486.0" x2="288.0" y2="486.0" stroke="#324c42" /><line x1="270.0" y1="471.0" x2="288.0" y2="471.0" stroke="#324c42" /><text x="90.0" y="295.0" font-size="12" text-anchor="start">Deck +500</text><text x="330.0" y="420.0" font-size="12" text-anchor="start">Tread +250</text><text x="330.0" y="532.5" font-size="11" text-anchor="start">pad top +77 · DPC + packers</text><text x="90.0" y="570.0" font-size="11" text-anchor="start">0 · garden</text><text x="90.0" y="710.0" font-size="10" text-anchor="start">pile footing (dashed, other X)</text><text x="246.0" y="710.0" font-size="11" text-anchor="start">pad base 350×500</text><text x="246.0" y="780.0" font-size="11" text-anchor="start">to −450 on firm ground</text><text x="147.0" y="430.0" font-size="11" text-anchor="start">bearer</text><text x="186.0" y="280.0" font-size="11" text-anchor="start">joist / rim</text><text x="222.0" y="525.0" font-size="11" text-anchor="start">cleat</text><text x="680.0" y="150.0" font-size="16" text-anchor="start">F7 · Pad brackets</text><text x="680.0" y="178.0" font-size="13" text-anchor="start">316 angle, one per rail per pad</text><text x="680.0" y="204.0" font-size="13" text-anchor="start">M10×75 SS sleeve anchor into pad top,</text><text x="680.0" y="228.0" font-size="13" text-anchor="start">≥100 mm from edges; 2×14g×35 into rail</text><text x="680.0" y="268.0" font-size="16" text-anchor="start">F5 · Tie cleats</text><text x="680.0" y="296.0" font-size="13" text-anchor="start">3×250 mm H4 on bearer face</text><text x="680.0" y="320.0" font-size="13" text-anchor="start">2×14g×100 into bearer, 2 into rail</text><text x="680.0" y="344.0" font-size="13" text-anchor="start">Lateral only; no tread weight</text><text x="680.0" y="384.0" font-size="16" text-anchor="start">Rail screen</text><text x="680.0" y="412.0" font-size="13" text-anchor="start">1.87 of 2.20 kNm (85%)</text><text x="680.0" y="436.0" font-size="13" text-anchor="start">max pad reaction 8.5 kN</text><text x="40.0" y="860.0" font-size="12" text-anchor="start">F1: 90×4 SS nails, two rows at 250, alternating faces, for bearers and tread rails. F2: 4×100×4 SS skew nails per pile.</text><text x="40.0" y="888.0" font-size="12" text-anchor="start">F3: Table 7.5 nailing, 2 per joist end into rim, 3 per crosspiece end. F4: three SSCPC40 pairs at the rebuilt rear row.</text><text x="40.0" y="916.0" font-size="12" text-anchor="start">F6: two M12×120 SS rim ties at X200/700, Z398. F7: four corner anchor kits (12 kN SS) and twelve pad brackets.</text><text x="40.0" y="944.0" font-size="12" text-anchor="start">Builder brief also checks cladding clearance, door threshold, weatherproofing and the consent exemption.</text><text x="40.0" y="972.0" font-size="12" text-anchor="start">Drawn at a pad; the pile and its footing (dashed) are at a different X and never share a hole except at the two ends.</text></svg>